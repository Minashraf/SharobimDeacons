definitions:
  db.GetHistoryServiceByDeaconIdRow:
    properties:
      date:
        type: string
      eventName:
        type: string
      liturgyName:
        type: string
      skill:
        type: string
    type: object
  payload.Deacon:
    properties:
      address:
        type: string
      country:
        type: string
      deacon_rank:
        type: integer
      dob:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      skills:
        items:
          $ref: '#/definitions/payload.DeaconSkill'
        type: array
    required:
    - country
    - deacon_rank
    - first_name
    - last_name
    type: object
  payload.DeaconSkill:
    properties:
      score:
        type: integer
      skill_id:
        type: integer
    required:
    - score
    - skill_id
    type: object
  payload.User:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  response.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Sharobim Deacons API
  version: "1.0"
paths:
  /deacons/:
    get:
      description: Lists All Deacons Paginated
      parameters:
      - description: Page Number
        in: query
        name: page
        type: string
      - description: Number of elements per page
        in: query
        name: limit
        type: string
      - description: first_name, date_of_birth, country, rank_name
        in: query
        name: sort
        type: string
      - description: ASC OR DESC
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
    post:
      description: Create a deacon profile
      parameters:
      - description: Creation
        in: body
        name: payload.Deacon
        required: true
        schema:
          $ref: '#/definitions/payload.Deacon'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
  /deacons/{id}:
    delete:
      description: Deletes a Deacon and his skills
      parameters:
      - description: Deacon ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
    get:
      description: Get A Detailed info of a specific deacon
      parameters:
      - description: Deacon ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
    put:
      description: Update a deacon and its skills
      parameters:
      - description: Creation
        in: body
        name: payload.Deacon
        required: true
        schema:
          $ref: '#/definitions/payload.Deacon'
      - description: Deacon ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
  /deacons/{id}/history:
    get:
      description: Get All Services done by a deacon
      parameters:
      - description: Deacon ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.GetHistoryServiceByDeaconIdRow'
            type: array
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      tags:
      - Deacons
  /user/login:
    post:
      consumes:
      - application/json
      description: Logs In The User
      parameters:
      - description: Logging
        in: body
        name: payload.User
        required: true
        schema:
          $ref: '#/definitions/payload.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      tags:
      - User
  /user/register:
    post:
      consumes:
      - application/json
      description: Creates a User for the application
      parameters:
      - description: Creation
        in: body
        name: payload.User
        required: true
        schema:
          $ref: '#/definitions/payload.User'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
